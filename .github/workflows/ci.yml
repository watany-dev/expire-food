name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: "24"
          cache: true
      - run: vp install --frozen-lockfile
      - name: Format / lint / type check
        run: vp check
      - name: Wrangler types are up to date
        run: vp exec wrangler types --check
      - name: Unit tests
        run: vp test
      - name: Build
        run: vp build
      - name: D1 migrations apply cleanly
        run: vp exec wrangler d1 migrations apply expire-food --local
        env:
          CI: "true"

  knip:
    name: knip (unused files / deps / exports)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: "24"
          cache: true
      - run: vp install --frozen-lockfile
      - run: vp exec knip

  semgrep:
    name: semgrep (SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: semgrep/semgrep:1.178.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test custom rules
        run: semgrep --test --config .semgrep/expire-food.yml .semgrep/expire-food.tsx
      - name: Scan
        run: >-
          semgrep scan
          --config .semgrep/expire-food.yml
          --config p/typescript
          --config p/secrets
          --error
          --metrics=off
