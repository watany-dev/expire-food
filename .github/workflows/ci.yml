name: CI

on:
  pull_request:
  push:
    branches: [main]
  # マージキューを有効化した瞬間に検証が抜けないよう、先に足しておく
  merge_group:
  # ランナー障害などの一時的な失敗を、空コミットなしで再実行できるようにする
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: "24"
          cache: true
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Format / lint / type check
        run: vp check
      - name: Wrangler types are up to date
        run: vp exec wrangler types --check
      - name: Unit tests (coverage thresholds in vite.config.ts)
        run: vp test --coverage
      - name: Build
        run: vp build
      # Workers のスクリプト上限は gzip 後で無料プラン 3 MB / 有料 10 MB。無料プランの上限で落とし、2/3 を超えたら警告する
      - name: Worker bundle size
        run: |
          size=$(find dist/expire_food -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.wasm' \) -exec cat {} + | gzip -9 | wc -c)
          limit=$((3 * 1024 * 1024))
          echo "Worker bundle (gzip): ${size} bytes / limit ${limit} bytes"
          if [ "$size" -gt "$limit" ]; then
            echo "::error::Worker bundle ${size} bytes exceeds the free-plan limit (3 MiB gzip)"
            exit 1
          fi
          if [ "$size" -gt $((limit * 2 / 3)) ]; then
            echo "::warning::Worker bundle ${size} bytes is over 2/3 of the free-plan limit"
          fi
      - name: D1 migrations apply cleanly
        run: vp exec wrangler d1 migrations apply expire-food --local
        env:
          CI: "true"

  knip:
    name: knip (unused files / deps / exports)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: "24"
          cache: true
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: knip
        run: vp exec knip

  semgrep:
    name: semgrep (SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: semgrep/semgrep:1.178.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test custom rules
        run: semgrep --test --config .semgrep/expire-food.yml .semgrep/expire-food.tsx
      - name: Scan
        run: >-
          semgrep scan
          --config .semgrep/expire-food.yml
          --config p/typescript
          --config p/secrets
          --error
          --metrics=off

  lighthouse:
    name: lighthouse (mobile, perf / a11y / Core Web Vitals)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: "24"
          cache: true
      - name: Install dependencies
        run: vp install --frozen-lockfile
      # 閾値は lighthouserc.json。サーバーは workerd ではなく Bun で app.fetch を直接配信する
      # （リモートの AI バインディングに認証が要るため）。SSR の HTML を測る目的には十分
      # INP はラボ計測できないため、代理指標の Total Blocking Time で見る
      # Speed Index は skipAudits で外している。高速なランナーでは中身の少ないページが最初のフレーム前に描画され
      # SPEEDINDEX_OF_ZERO になり、Performance が NaN になるため。Performance は FCP / LCP / TBT / CLS の加重平均になる
      - name: Lighthouse CI
        run: vp run lighthouse
      # 1 つでも指標がエラーになるとカテゴリのスコアは null（NaN）になり、原因がログに出ないので列挙する
      - name: Show errored audits
        if: failure()
        run: |
          for f in .lighthouseci/lhr-*.json; do
            jq -r '.runtimeError // empty | "runtimeError: \(.code) \(.message)"' "$f"
            jq -r '.audits[] | select(.scoreDisplayMode == "error") | "\(.id): \(.errorMessage)"' "$f"
          done
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 7
          include-hidden-files: true

  e2e:
    name: e2e (Playwright, iPhone / Pixel)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: "24"
          cache: true
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Install Chromium
        run: vp exec playwright install --with-deps chromium
      - name: Playwright
        run: vp run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  zghalint:
    name: zghalint (workflow lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # アクション内の取得はリトライしないので、Releases の一時的な 5xx でジョブが落ちる。
      # 取得と検証（アクションと同じ SHA256SUMS 照合）をここでリトライ付きで行い、binary で渡す
      - name: Download zghalint
        env:
          BASE_URL: https://github.com/watany-dev/zghalint/releases/download/v0.0.2
          ARCHIVE: zghalint-linux-x86_64.tar.gz
        run: |
          curl -fsSL --retry 5 --retry-all-errors "$BASE_URL/$ARCHIVE" -o "$ARCHIVE"
          curl -fsSL --retry 5 --retry-all-errors "$BASE_URL/SHA256SUMS" -o SHA256SUMS
          sha256sum --ignore-missing -c SHA256SUMS
          tar -xzf "$ARCHIVE"
      - uses: watany-dev/zghalint@49748850f6fa16bcb5302539425b0879275c259e # v0.0.2
        with:
          binary: ./zghalint-linux-x86_64/zghalint
          paths: ".github/workflows/*.yml"
          # ネットワークルールは GitHub API のレート制限で結果が揺れるため切る
          offline: "true"
